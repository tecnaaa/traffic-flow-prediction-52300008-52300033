
name: TomTom Traffic Data Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-dotenv

      - name: Run Data Collection Script
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TZ: "Asia/Ho_Chi_Minh"
        run: python scripts/traffic_data_collect.py

      - name: Commit and Push Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/traffic_data.csv
          git commit -m "Auto-update: Fetch traffic data [skip ci]" || echo "No changes to commit"

          git pull --rebase origin dev
          git push origin dev
